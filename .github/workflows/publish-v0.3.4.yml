# Publicação pontual autorizada da correção da barra; preserva versões anteriores.
name: Publicar Widgy 0.3.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.3.4.yml'

permissions:
  contents: write

jobs:
  windows:
    if: "startsWith(github.event.head_commit.message, 'release: publicar v0.3.4')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Conferir versão
        shell: bash
        run: test "$(node -p "require('./package.json').version")" = "0.3.4"
      - run: npm ci
      - run: npm run test:media
      - run: npm run test:taskbar
      - run: npm run build
      - name: Testar prévias reais Electron e DWM
        run: npm run test:taskbar:windows
      - name: Criar release Widgy 0.3.4
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v0.3.4 >/dev/null 2>&1 || gh release create v0.3.4 --target "$GITHUB_SHA" --title "Widgy 0.3.4 — Correções da barra de tarefas" --notes "Corrige abertura e reabertura das prévias dos aplicativos, cobre a região atrás da dock transparente e reforça a ocultação da barra original do Windows. Testes automatizados, compilação e prévias Electron/DWM validados no Windows. Mantém as configurações existentes."
      - name: Gerar instalador e publicar atualização automática
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always
      - name: Confirmar arquivos publicados
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v0.3.4 --json assets --jq '.assets[].name' | grep -Fx 'Widgy-Setup-0.3.4.exe'
          gh release view v0.3.4 --json assets --jq '.assets[].name' | grep -Fx 'Widgy-Setup-0.3.4.exe.blockmap'
          gh release view v0.3.4 --json assets --jq '.assets[].name' | grep -Fx 'latest.yml'
