name: Publicar Widgy 0.3.8

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.3.8.yml"

permissions:
  contents: write

jobs:
  windows:
    if: "startsWith(github.event.head_commit.message, 'release: publicar v0.3.8')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Conferir versao
        shell: bash
        run: test "$(node -p "require('./package.json').version")" = "0.3.8"
      - name: Instalar dependencias
        run: npm ci
      - name: Testar Spotify e player do PC
        run: npm run test:media
      - name: Testar atalhos e barra do Widgy
        run: npm run test:taskbar
      - name: Compilar aplicativo
        run: npm run build
      - name: Validar previas da barra com Windows e DWM
        run: npm run test:taskbar:windows
      - name: Criar release Widgy 0.3.8
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v0.3.8 >/dev/null 2>&1 || gh release create v0.3.8 --target "$GITHUB_SHA" --title "Widgy 0.3.8 — Spotify minimalista e responsivo" --notes "Widget Spotify redesenhado: capa em destaque, tipografia simples, controles alinhados, progresso discreto, fundo neutro e layouts adaptativos para cards pequenos, médios e verticais. Mantém temas, configurações anteriores e controles da central de mídia do Windows. Traz também as correções de barra, atalhos e descoberta de aplicativos das versões anteriores."
      - name: Gerar instalador Windows e publicar atualizacao
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always
      - name: Confirmar arquivos do instalador
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v0.3.8 --json assets --jq '.assets[].name' | grep -Fx 'Widgy-Setup-0.3.8.exe'
          gh release view v0.3.8 --json assets --jq '.assets[].name' | grep -Fx 'Widgy-Setup-0.3.8.exe.blockmap'
          gh release view v0.3.8 --json assets --jq '.assets[].name' | grep -Fx 'latest.yml'
