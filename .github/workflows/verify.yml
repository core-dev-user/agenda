name: Verificar build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:media
      - run: npm run test:taskbar
      - run: npm run test:wallpaper
      - run: npm run test:security
      - run: npm run test:finance
      - run: npm run test:perf
      - run: npm run build

  powershell-syntax:
    name: Windows media worker (PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validar sintaxe do leitor do Spotify
        shell: powershell
        run: |
          node -e "require('fs').writeFileSync('media-worker-test.ps1', require('./electron/media.cjs').PS)"
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) 'media-worker-test.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.ToString() }
            exit 1
          }

      - name: Validar e exercitar medição de RAM/CPU em Windows
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) 'scripts/perf-live.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_.ToString() }; exit 1 }
          & ./scripts/perf-live.ps1 -Seconds 5 -IntervalMs 1000 -OutputPath "$env:RUNNER_TEMP/perf-live-smoke.json"
          $result = Get-Content "$env:RUNNER_TEMP/perf-live-smoke.json" -Raw | ConvertFrom-Json
          if ($result.samples.Count -lt 2 -or $result.summary.Count -ne 3) { throw "Relatório de desempenho incompleto" }

  windows-native-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate Windows app-discovery PowerShell syntax
        shell: powershell
        run: |
          node -e "require('fs').writeFileSync('startapps-test.ps1', require('./electron/startapps.cjs').PS)"
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) 'startapps-test.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.ToString() }
            exit 1
          }
      - name: Compile native helpers with Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('electron/keys.cjs', 'electron/winhelper.cjs')) {
            $source = Get-Content $file -Raw -Encoding UTF8
            $match = [regex]::Match($source, '(?s)const CS = String\.raw`(.*?)`')
            if (-not $match.Success) { throw "Native source missing: $file" }
            if ($file -like '*winhelper*') {
              Add-Type -ReferencedAssemblies System.Drawing, System.Windows.Forms -TypeDefinition $match.Groups[1].Value
            } else {
              Add-Type -TypeDefinition $match.Groups[1].Value
            }
          }
      - run: npm ci
      - run: npm run build
      - name: Verify Electron and native DWM previews
        run: npm run test:taskbar:windows
