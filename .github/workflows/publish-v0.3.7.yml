name: Publicar Widgy 0.3.7

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.3.7.yml"

permissions:
  contents: write

jobs:
  windows:
    if: "startsWith(github.event.head_commit.message, 'release: publicar v0.3.7')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Conferir versao
        shell: bash
        run: test "$(node -p "require('./package.json').version")" = "0.3.7"
      - name: Instalar dependencias
        run: npm ci
      - name: Testar Spotify e player do PC
        run: npm run test:media
      - name: Testar atalhos e barra do Widgy
        run: npm run test:taskbar
      - name: Compilar aplicativo
        run: npm run build
      - name: Validar previas da barra com Windows e DWM
        run: npm run test:taskbar:windows
      - name: Criar release Widgy 0.3.7
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v0.3.7 >/dev/null 2>&1 || gh release create v0.3.7 --target "$GITHUB_SHA" --title "Widgy 0.3.7 — Recuperação automática da barra" --notes "Melhora a estabilidade da barra de tarefas personalizada: após falhas temporárias do auxiliar ou renderizador, restaura a barra nativa e tenta reativar o Widgy automaticamente com intervalos progressivos, sem perder suas preferências. Em caso de falhas persistentes, deixa a barra do Windows habilitada por segurança. Inclui correções de Win+D, Ctrl+Alt+D, atalhos de jogos e catálogo de aplicativos das versões anteriores. Dados e configurações preservados."
      - name: Gerar instalador Windows e publicar atualizacao
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always
      - name: Confirmar arquivos do instalador
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v0.3.7 --json assets --jq '.assets[].name' | grep -Fx 'Widgy-Setup-0.3.7.exe'
          gh release view v0.3.7 --json assets --jq '.assets[].name' | grep -Fx 'Widgy-Setup-0.3.7.exe.blockmap'
          gh release view v0.3.7 --json assets --jq '.assets[].name' | grep -Fx 'latest.yml'
