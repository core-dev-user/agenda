# Publica instalador Windows por etiqueta vX.Y.Z ou automaticamente quando package.json
# recebe uma nova versão na main. O runner cria a tag usando GITHUB_TOKEN;
# tags criadas por esse token não iniciam outra execução do mesmo workflow.
name: Lançar versão

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["package.json"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Identificar versão e preparar etiqueta
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "$TAG" ]]; then
              echo "Etiqueta não corresponde à versão do package.json"
              exit 1
            fi
          else
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "Etiqueta $TAG já existe, sem nova publicação."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Instalar dependências
        if: steps.version.outputs.skip != 'true'
        run: npm ci

      - name: Testar integrações, segurança e desempenho
        if: steps.version.outputs.skip != 'true'
        run: |
          npm run test:media
          npm run test:templates
          npm run test:a11y
          npm run test:widgets
          npm run test:flows
          npm run test:rooms
          npm run test:wallpaper
          npm run test:security
          npm run test:finance
          npm run test:perf
          npm run test:taskbar
          npm run test:valorant

      - name: Compilar aplicativo
        if: steps.version.outputs.skip != 'true'
        run: npm run build

      - name: Criar a Release
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Widgy ${TAG#v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar o instalador e publicar a Release
        if: steps.version.outputs.skip != 'true'
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
