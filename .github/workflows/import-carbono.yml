name: Importar pacote Carbono (temporario)

on:
  push:
    branches:
      - feat/carbono-pack
    paths:
      - .github/workflows/import-carbono.yml

permissions:
  contents: write

jobs:
  import:
    if: "startsWith(github.event.head_commit.message, 'build: importar Carbono')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Recuperar patch original e validar integridade
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, zlib
          shas = [
              "2573551c69062351965e6d76f534fac021180465",
              "1d1f378aec97f6de9bbd4ec3e57733adaa6131fe",
              "4b914e28edfe97bafd07ca9592b5b091b8457b54",
              "e8c33b25de8f81b5406f1ec11784fbeb2a38ecba",
              "512003026a69124212fce2082e6cc25ee397b97c",
              "343a98d2c17d653fb263c21ef66849885a51d16b",
              "122739e7405cc30b00d5452e475f40775b1f4229",
              "a59ac400695eddfa1a0be0a4aadcdcf3439f166e",
          ]
          packed = bytearray()
          for sha in shas:
              obj = json.loads(subprocess.check_output(
                  ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{sha}"],
                  text=True,
              ))
              assert obj["encoding"] == "base64", sha
              block = base64.b64decode(obj["content"])
              calculated = hashlib.sha1(b"blob " + str(len(block)).encode() + b"\0" + block).hexdigest()
              assert calculated == sha, (sha, calculated)
              packed.extend(block)
          patch = zlib.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == "8de61448a53e3484b1e3977928b334747e9380e92846a76906f254ba1045d602"
          pathlib.Path("/tmp/carbono.patch").write_bytes(patch)
          print("Pacote original validado:", len(patch), "bytes")
          PY
      - name: Aplicar somente os oito arquivos do pacote
        run: |
          git apply --check /tmp/carbono.patch
          git apply /tmp/carbono.patch
      - name: Confirmar correspondencia byte a byte com o ZIP
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          files = {
              "src/components/CommandPalette.tsx": "917635f912cddb85682bebe00ce475c7cb9d3d71",
              "src/App.tsx": "dd162ab9779db19f76eb19b0060350338be3121a",
              "src/sections/SettingsView.tsx": "3d896f80bfa5e6f70b9496f3d32bd98e29782c36",
              "src/shell/PackSettings.tsx": "2b277bd866a0e0d5f3191cd00f6cf7e11da50a8b",
              "src/shell/Dashboard.tsx": "c4f4a1a552b9f1826a8264e16e06f2c8d2a559f5",
              "src/shell/Carbono.tsx": "01a6a70bb2c0cb454a43306299aa1a0968e693cd",
              "src/shell/pack.ts": "ff6ec260bb3e5d5feaf23f8500e3080765b9a08f",
              "src/lib/types.ts": "c6f8ee06bd7e22bed4ba6c2bd7cab68a2d710e7a",
          }
          for name, expected in files.items():
              data = pathlib.Path(name).read_bytes()
              actual = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              assert actual == expected, (name, actual, expected)
              print("OK", name)
          PY
      - name: Instalar dependencias
        run: npm ci
      - name: Executar npm run build
        run: npm run build
      - name: Testes de regressao
        run: |
          npm run test:media
          npm run test:wallpaper
          npm run test:taskbar
      - name: Commit na branch apos testes
        run: |
          git config user.name "widgy-ci[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/App.tsx src/components/CommandPalette.tsx src/lib/types.ts src/sections/SettingsView.tsx src/shell/pack.ts src/shell/Carbono.tsx src/shell/Dashboard.tsx src/shell/PackSettings.tsx
          git commit -m "feat(carbono): adicionar pacote de interface em Configuracoes"
          git push origin HEAD:refs/heads/feat/carbono-pack
