<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512">
  <title>Widgy — sakura azul</title>
  <defs>
    <linearGradient id="w-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3DBAF9"/>
      <stop offset=".33" stop-color="#137FFA"/>
      <stop offset="1" stop-color="#0647D8"/>
    </linearGradient>
    <linearGradient id="w-head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#61CCFF"/>
      <stop offset="1" stop-color="#168AF7"/>
    </linearGradient>
    <linearGradient id="w-petal" x1=".15" y1="0" x2=".88" y2="1">
      <stop offset="0" stop-color="#FAFDFF"/>
      <stop offset=".58" stop-color="#E4F3FF"/>
      <stop offset="1" stop-color="#A9D4FF"/>
    </linearGradient>
    <clipPath id="w-clip"><rect x="8" y="10" width="112" height="112" rx="28"/></clipPath>
  </defs>
  <rect x="8" y="10" width="112" height="112" rx="28" fill="url(#w-bg)"/>
  <g clip-path="url(#w-clip)">
    <rect x="8" y="10" width="112" height="28" fill="url(#w-head)"/>
    <path d="M8 37.5H120" stroke="#B6E9FF" stroke-opacity=".28" stroke-width=".8"/>
  </g>
  <g>
    <rect x="34" y="2" width="12" height="24" rx="6" fill="#003EA9" opacity=".22"/>
    <rect x="35" y="0.5" width="10" height="23" rx="5" fill="#DDF2FF"/>
    <rect x="83" y="2" width="12" height="24" rx="6" fill="#003EA9" opacity=".22"/>
    <rect x="84" y="0.5" width="10" height="23" rx="5" fill="#DDF2FF"/>
  </g>
  <!-- A sakura de cinco pétalas mantém a identidade da antiga Agenda. -->
  <g transform="translate(64 79) scale(.84)">
    <g fill="url(#w-petal)">
      <path d="M0 0C-15-9-19-31-8-43L0-37 8-43C19-31 15-9 0 0Z"/>
      <path transform="rotate(72)" d="M0 0C-15-9-19-31-8-43L0-37 8-43C19-31 15-9 0 0Z"/>
      <path transform="rotate(144)" d="M0 0C-15-9-19-31-8-43L0-37 8-43C19-31 15-9 0 0Z"/>
      <path transform="rotate(216)" d="M0 0C-15-9-19-31-8-43L0-37 8-43C19-31 15-9 0 0Z"/>
      <path transform="rotate(288)" d="M0 0C-15-9-19-31-8-43L0-37 8-43C19-31 15-9 0 0Z"/>
    </g>
    <g fill="#2184EA">
      <ellipse cy="-11.8" rx="2.2" ry="4.6"/>
      <ellipse cy="-11.8" rx="2.2" ry="4.6" transform="rotate(72)"/>
      <ellipse cy="-11.8" rx="2.2" ry="4.6" transform="rotate(144)"/>
      <ellipse cy="-11.8" rx="2.2" ry="4.6" transform="rotate(216)"/>
      <ellipse cy="-11.8" rx="2.2" ry="4.6" transform="rotate(288)"/>
    </g>
    <circle r="4" fill="#EDF8FF"/>
  </g>
